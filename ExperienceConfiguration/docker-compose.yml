version: '3.8'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: /Sanji33
      POSTGRES_DB: experiences-config
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  springboot-app:
    build:
      context: ./ExperiencesConfigurationBackend
      dockerfile: Dockerfile
      args:
        UID: ${UID:-1000}  # Defaults to 1000 if not set in environment
        GID: ${GID:-1000}  # Defaults to 1000 if not set in environment
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./ExperiencesConfigurationBackend:/home/springuser/app
      - ../config_files_host:/home/springuser/config_files_container
      - ~/.m2:/home/springuser/.m2

  angular-frontend:
    build:
      context: ./ExperiencesConfigurationTemplate
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - springboot-app
    volumes:
      - ./ExperiencesConfigurationTemplate:/app
      - /app/node_modules  # Ensure node_modules is correctly handled

volumes:
  postgres-data:
