version: '3.8'
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: /Sanji33
      POSTGRES_DB: experiences-config
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  springboot-app:
    build:
      context: ./ExperiencesConfigurationBackend
      dockerfile: Dockerfile
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    volumes:
      - ./ExperiencesConfigurationBackend:/home/app
      - ~/.m2:/root/.m2  # To cache Maven dependencies

  angular-frontend:
    build:
      context: ./ExperiencesConfigurationTemplate
      dockerfile: Dockerfile
    ports:
      - "4200:4200"
    depends_on:
      - springboot-app
    volumes:
      - ./ExperiencesConfigurationTemplate:/app
      - /app/node_modules  # Ensure node_modules is correctly handled

volumes:
  postgres-data:
